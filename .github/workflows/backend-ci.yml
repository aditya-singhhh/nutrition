name: backend-ci
on:
  pull_request:
  push: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check app tests --select E,F,B --ignore E501,E701,E702,B008
      - run: pytest -q          # includes seed-data integrity + safety + golden-behaviour tests
      - run: pip install pip-audit && pip-audit   # dependency scanning
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hc-api ./backend
